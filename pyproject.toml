[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toxicogenomics-benchmark-dose-engine"
version = "2.0.0"
description = "ToxBenchmark: Benchmark Dose (BMD/BMDL) & Transcriptomic Hazard Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
toxicogenomics-benchmark-dose-engine = "tox_benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/toxicogenomics-benchmark-dose-engine"
Repository = "https://github.com/abusuraihsakhri/toxicogenomics-benchmark-dose-engine.git"
